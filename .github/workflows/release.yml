name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for version history.

            **SDK package:** `@robot-face/sdk` — publish instructions in `packages/robot-face-sdk/PUBLISH.md`.

      # Uncomment when NPM_TOKEN is configured on the repository:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     registry-url: "https://registry.npmjs.org"
      # - run: npm ci
      # - run: npm run build -w @robot-face/sdk
      # - run: npm publish -w @robot-face/sdk --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
