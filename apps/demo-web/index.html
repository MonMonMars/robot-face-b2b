<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Face B2B — Control Studio</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="brand">
          <h1>Robot Face</h1>
          <span class="brand__tag">B2B Control</span>
        </header>

        <section class="panel">
          <h2>Connection</h2>
          <label class="field">
            <span>Adapter</span>
            <select id="adapter-id">
              <option value="mock">Mock (simulator)</option>
              <option value="unitree">Unitree (dry-run)</option>
              <option value="humanoid-generic">Humanoid (dry-run)</option>
            </select>
          </label>
          <div id="conn-badge" class="badge badge--off" role="status">Disconnected</div>
          <button id="connect" type="button" class="btn btn--primary">Connect</button>
        </section>

        <section class="panel">
          <h2>Presets</h2>
          <select id="preset" class="preset-select"></select>
          <p id="preset-desc" class="hint"></p>
          <div class="row">
            <button id="apply-preset" type="button" class="btn" disabled>Apply pose</button>
            <button id="play-preset" type="button" class="btn" disabled>Play sequence</button>
          </div>
          <label class="field check">
            <input id="loop-playback" type="checkbox" />
            <span>Loop sequence</span>
          </label>
          <button id="stop-playback" type="button" class="btn btn--ghost" disabled>Stop playback</button>
        </section>
      </aside>

      <main class="stage">
        <div class="stage__top">
          <section class="face-wrap" aria-live="polite">
            <div id="face" class="face face--neutral" role="img" aria-label="Robot face preview">
              <span class="face__eyes"></span>
              <span class="face__mouth"></span>
            </div>
            <div id="dominant-label" class="dominant">neutral</div>
          </section>

          <section class="panel blends">
            <h2>Live blend</h2>
            <div id="blend-sliders" class="sliders"></div>
            <label class="field">
              <span>Transition (ms)</span>
              <input id="duration" type="number" min="0" max="3000" value="350" />
            </label>
            <button id="apply-blend" type="button" class="btn btn--primary" disabled>Send frame</button>
          </section>
        </div>

        <section class="panel timeline-panel">
          <div class="timeline-header">
            <h2>Expression timeline</h2>
            <span id="playback-state" class="playback-state">idle</span>
          </div>
          <div class="timeline-track">
            <div id="timeline-progress" class="timeline-progress"></div>
            <div id="timeline-markers" class="timeline-markers"></div>
          </div>
          <p id="timeline-meta" class="hint">Connect and play a preset sequence to see progress.</p>
        </section>

        <section class="panel log-panel">
          <h2>Event log</h2>
          <pre id="log"></pre>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
